<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hesabım – Finansal Yönetim Paneli</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0a0f1e;--bg2:#111827;--bg3:#1e2a3d;--bg4:#253347;
--card:#151f2e;--card2:#1a2540;
--border:#2a3a52;--border2:#3a4f6a;
--text:#e8edf5;--text2:#8fa3be;--text3:#5a7a9a;
--blue:#3b82f6;--blue2:#1d4ed8;--blue-bg:#1e3a5f;
--green:#22c55e;--green2:#15803d;--green-bg:#1a3d2b;
--red:#ef4444;--red2:#991b1b;--red-bg:#3d1a1a;
--orange:#f97316;--orange2:#c2410c;--orange-bg:#3d2010;
--purple:#a855f7;--purple2:#7e22ce;--purple-bg:#2d1a3d;
--yellow:#eab308;--yellow2:#a16207;--yellow-bg:#3d3010;
--teal:#14b8a6;--teal2:#0f766e;--teal-bg:#1a3030;
--amber:#f59e0b;
--radius:8px;--radius-lg:12px;--radius-xl:16px;
--shadow:0 4px 20px rgba(0,0,0,0.4);
}
.light{
--bg:#f0f4f8;--bg2:#e8edf5;--bg3:#dde4ee;--bg4:#d0d9e8;
--card:#ffffff;--card2:#f8fafc;
--border:#cbd5e1;--border2:#94a3b8;
--text:#1e293b;--text2:#475569;--text3:#94a3b8;
--blue-bg:#dbeafe;--green-bg:#dcfce7;--red-bg:#fee2e2;
--orange-bg:#ffedd5;--purple-bg:#f3e8ff;--yellow-bg:#fef3c7;
--teal-bg:#ccfbf1;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh;transition:background .3s,color .3s}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.app{display:flex;height:100vh;overflow:hidden}
/* Sidebar */
.sidebar{width:240px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .3s}
.sidebar.collapsed{width:60px}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.logo-text{font-size:16px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden}
.logo-sub{font-size:10px;color:var(--text2);white-space:nowrap}
.sidebar-firm{padding:12px 16px;border-bottom:1px solid var(--border)}
.firm-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.firm-select{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:var(--radius);font-size:12px;cursor:pointer}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px}
.nav-section{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:12px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);cursor:pointer;transition:all .2s;margin-bottom:2px;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--blue-bg);color:var(--blue)}
.nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}
.nav-label{font-size:13px;font-weight:500}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;flex-shrink:0}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar-title{font-size:18px;font-weight:700;flex:1}
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;width:240px}
.search-box input{background:none;border:none;color:var(--text);font-size:13px;width:100%;outline:none}
.topbar-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:7px 12px;border-radius:var(--radius);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .2s}
.topbar-btn:hover{background:var(--bg4);color:var(--text);border-color:var(--border2)}
.content{flex:1;overflow-y:auto;padding:20px}
/* Cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--blue))}
.stat-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px;white-space:nowrap}
.stat-sub{font-size:11px;color:var(--text3)}
.stat-icon{position:absolute;right:14px;top:14px;font-size:24px;opacity:0.3}
/* Tables */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.table-header{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.table-title{font-size:14px;font-weight:600}
.table-actions{margin-left:auto;display:flex;gap:8px}
table{width:100%;border-collapse:collapse}
th{background:var(--bg3);padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-orange{background:var(--orange-bg);color:var(--orange)}
.badge-purple{background:var(--purple-bg);color:var(--purple)}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow)}
.badge-teal{background:var(--teal-bg);color:var(--teal)}
.badge-gray{background:var(--bg3);color:var(--text2)}
/* Buttons */
.btn{padding:8px 16px;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:500;border:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue2)}
.btn-success{background:var(--green2);color:#fff}
.btn-danger{background:var(--red2);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-outline:hover{background:var(--bg3);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}
/* Progress */
.progress-bar{background:var(--bg3);border-radius:4px;height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .5s}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--card);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;padding:0;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1}
.modal-title{font-size:16px;font-weight:700}
.modal-body{padding:20px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
/* Forms */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.full{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;font-weight:500;color:var(--text2)}
.form-control{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:var(--radius);font-size:14px;outline:none;transition:border-color .2s;min-height:44px}
.form-control:focus{border-color:var(--blue)}
select.form-control option{background:var(--bg2)}
/* Charts */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:20px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px}
.chart-title{font-size:13px;font-weight:600;margin-bottom:14px;color:var(--text2)}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-item{display:flex;align-items:center;gap:10px}
.bar-label{font-size:12px;color:var(--text2);width:130px;text-align:right;flex-shrink:0}
.bar-track{flex:1;background:var(--bg3);border-radius:4px;height:20px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;transition:width .6s}
.bar-value{font-size:12px;color:var(--text2);width:90px;text-align:right;flex-shrink:0}
/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day-header{text-align:center;padding:8px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase}
.cal-day{background:var(--bg3);border-radius:6px;min-height:80px;padding:6px;cursor:pointer;transition:background .2s;border:1px solid transparent}
.cal-day:hover{background:var(--bg4);border-color:var(--border2)}
.cal-day.today{border-color:var(--blue);background:var(--blue-bg)}
.cal-day.other-month .cal-date{color:var(--text3)}
.cal-date{font-size:12px;font-weight:600;margin-bottom:4px}
.cal-event{font-size:10px;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
/* Alert */
.alert{padding:12px 16px;border-radius:var(--radius);margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.alert-danger{background:var(--red-bg);border:1px solid var(--red2);color:var(--red)}
.alert-warning{background:var(--yellow-bg);border:1px solid var(--yellow2);color:var(--yellow)}
.alert-info{background:var(--blue-bg);border:1px solid var(--blue2);color:var(--blue)}
/* Responsive */
@media(max-width:768px){
.sidebar{position:fixed;left:-240px;top:0;bottom:0;z-index:200;transition:left .3s}
.sidebar.mobile-open{left:0}
.sidebar.collapsed{left:-60px}
.stat-grid{grid-template-columns:repeat(2,1fr)}
.form-row{grid-template-columns:1fr}
.table-wrap{overflow-x:auto}
}
/* Notification dot */
.notif-dot{width:8px;height:8px;background:var(--red);border-radius:50%;flex-shrink:0}
/* Section title */
.section-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-icon{font-size:48px;margin-bottom:12px}
/* Tabs */
.tabs{display:flex;gap:4px;background:var(--bg3);padding:4px;border-radius:var(--radius);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);transition:all .2s;white-space:nowrap}
.tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}
/* Risk indicator */
.risk-bar{height:8px;border-radius:4px;overflow:hidden;display:flex;gap:1px}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut-legend{display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
/* Print */
@media print{
.sidebar,.topbar,.modal-overlay,.topbar-btn{display:none!important}
.main{display:block}
.content{padding:0}
body{background:#fff;color:#000}
}
/* Filter Bar */
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);align-items:flex-end}
.filter-bar .filter-group{display:flex;flex-direction:column;gap:4px;min-width:140px}
.filter-bar .filter-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;font-weight:600}
.filter-bar .filter-control{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:var(--radius);font-size:12px;outline:none;cursor:pointer;min-height:34px}
.filter-bar .filter-control:focus{border-color:var(--blue)}
.filter-bar .filter-reset{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:var(--radius);font-size:12px;cursor:pointer;align-self:flex-end;white-space:nowrap;transition:all .2s}
.filter-bar .filter-reset:hover{background:var(--bg4);color:var(--text)}
.filter-bar .filter-count{font-size:11px;color:var(--text3);align-self:center;margin-left:auto}
.bank-group-header{display:flex;align-items:center;gap:10px;padding:12px 0 8px;margin-top:8px;border-bottom:2px solid var(--border);grid-column:1/-1}
.bank-group-header .bank-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.bank-group-header .bank-name{font-size:14px;font-weight:700;color:var(--text)}
.bank-group-header .bank-count{font-size:12px;color:var(--text3)}
.upcoming-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
/* Sidebar 3D hover + module colors */
.nav-item{position:relative;transition:all .3s cubic-bezier(.25,.8,.25,1);transform-style:preserve-3d;perspective:600px}
.nav-item:hover{transform:translateX(6px) rotateY(-3deg) scale(1.02);box-shadow:0 4px 15px rgba(0,0,0,0.2)}
.nav-item.active{transform:translateX(4px);box-shadow:0 2px 12px rgba(59,130,246,0.3)}
.nav-item::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 3px 3px 0;background:transparent;transition:background .3s}
.nav-item.active::after{background:var(--nav-accent,var(--blue))}
.nav-item:hover::after{background:var(--nav-accent,var(--text3))}
.sidebar-nav{scrollbar-width:thin}
.sidebar-logo{transition:all .3s}
.sidebar-logo:hover{transform:scale(1.02)}
.logo-icon{transition:transform .4s cubic-bezier(.68,-.55,.27,1.55)}
.logo-icon:hover{transform:rotate(-10deg) scale(1.1)}
.nav-section{transition:all .3s;position:relative;padding-left:12px}
.nav-section::before{content:'';position:absolute;left:0;top:50%;width:4px;height:1px;background:var(--text3);transition:width .3s}
@keyframes navSlideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.sidebar-nav .nav-item{animation:navSlideIn .4s ease both}
.sidebar-nav .nav-item:nth-child(1){animation-delay:.02s}
.sidebar-nav .nav-item:nth-child(2){animation-delay:.04s}
.sidebar-nav .nav-item:nth-child(3){animation-delay:.06s}
.sidebar-nav .nav-item:nth-child(4){animation-delay:.08s}
.sidebar-nav .nav-item:nth-child(5){animation-delay:.10s}
.sidebar-nav .nav-item:nth-child(6){animation-delay:.12s}
.sidebar-nav .nav-item:nth-child(7){animation-delay:.14s}
.sidebar-nav .nav-item:nth-child(8){animation-delay:.16s}
.sidebar-nav .nav-item:nth-child(9){animation-delay:.18s}
.sidebar-nav .nav-item:nth-child(10){animation-delay:.20s}
.sidebar-nav .nav-item:nth-child(11){animation-delay:.22s}
.sidebar-nav .nav-item:nth-child(12){animation-delay:.24s}
.sidebar-nav .nav-item:nth-child(13){animation-delay:.26s}
.sidebar-nav .nav-item:nth-child(14){animation-delay:.28s}
.sidebar-nav .nav-item:nth-child(15){animation-delay:.30s}
.sidebar-nav .nav-item:nth-child(16){animation-delay:.32s}
.content-fade{animation:contentFadeIn .4s ease}
@keyframes contentFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
